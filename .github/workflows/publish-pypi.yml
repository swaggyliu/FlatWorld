# Publish flat-world-model to PyPI via Trusted Publisher (OIDC). No API tokens.
# After configuring the Trusted Publisher on pypi.org: pip install flat-world-model
#
# PyPI Trusted Publisher settings (create pending publisher if project is new):
#   PyPI project name: flat-world-model
#   Owner: swaggyliu
#   Repository: FlatWorld
#   Workflow name: publish-pypi.yml
#   Environment: (leave empty)

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read   # job perms replace workflow perms; needed for actions/checkout
      id-token: write  # required for OIDC Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
