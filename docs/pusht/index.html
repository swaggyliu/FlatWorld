<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>FlatWorld — You vs AI (Push-T)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>You vs AI</h1>
    <p class="sub">Push-T · joystick 360° · WM+PPO on the right</p>
  </header>
  <div class="bar">
    <span id="score">YOU 0 — AI 0</span>
    <span id="status">connecting…</span>
  </div>
  <div class="toolbar">
    <div id="difficulty" class="difficulty" aria-label="AI difficulty">
      <span>AI</span>
      <button type="button" data-level="low">Low</button>
      <button type="button" data-level="medium" class="active">Medium</button>
      <button type="button" data-level="high">High</button>
    </div>
    <div class="actions">
      <button type="button" id="rematch" class="action-btn">Rematch</button>
      <button type="button" id="pause" class="action-btn ghost">Pause</button>
    </div>
  </div>
  <canvas id="c" width="1100" height="560" tabindex="0"></canvas>
  <div id="stick" class="stick" aria-label="Move stick">
    <div class="stick-base">
      <div class="stick-knob" id="stick-knob"></div>
    </div>
    <p class="stick-label">Drag to move · 360°</p>
  </div>
  <p class="hint">
    Drag the stick (mouse or finger) for any direction · also drag on the YOU panel ·
    Rematch / difficulty · 1/2/3 · Space/R · P
  </p>
  <script src="config.js?v=secure2"></script>
  <script src="app.js?v=secure2"></script>
</body>
</html>
